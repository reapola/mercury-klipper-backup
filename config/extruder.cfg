[extruder]
control: mpc
heater_power: 27  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 
nozzle_diameter: 0.400
step_pin: toolhead:EXT_STEP
dir_pin: !toolhead:EXT_DIR
enable_pin: !toolhead:EXT_EN
rotation_distance: 21.5450025
gear_ratio: 50:10
microsteps: 16
full_steps_per_rotation: 200
max_extrude_only_velocity: 50.0
max_extrude_only_accel: 1500
heater_pin: toolhead:HE0
sensor_pin: toolhead:TH0
sensor_type: ATC Semitec 104NT-4-R025H42G 
pullup_resistor: 2200           
min_temp: 0
max_temp: 310
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_cross_section: 50

[tmc2209 extruder]
uart_pin: toolhead:EXT_UART
diag_pin: ^toolhead:EXT_DIAG
run_current: 0.30
sense_resistor: 0.110
interpolate: false

[filament_switch_sensor Extruder]
pause_on_runout: False
switch_pin: toolhead:LIMIT_0

#runout_distance: 0.0
#   Defines how much filament can still be pulled after the
#   switch sensor triggered (e.g. you have a 60cm reverse bowden between your
#   extruder and your sensor, you would then set runout_distance to something
#   like 590 to leave a small safety margin and now the print will not
#   immediately pause when the sensor triggers but rather keep printing until
#   the filament is at the extruder). The default is 0 millimeters.
#event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
#pause_delay: 0.5
#   The amount of time to delay, in seconds, between the pause command
#   dispatch and execution of the runout_gcode. It may be useful to
#   increase this delay if OctoPrint exhibits strange pause behavior.
#   Default is 0.5 seconds.
#debounce_delay:
#   A period of time in seconds to debounce events prior to running the
#   switch gcode. The switch must he held in a single state for at least
#   this long to activate. If the switch is toggled on/off during this delay,
#   the event is ignored. Default is 0.


