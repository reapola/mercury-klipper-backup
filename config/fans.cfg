[multi_pin cooling_fans]
pins: toolhead:FAN1,toolhead:FAN2

[fan]
pin: multi_pin:cooling_fans
kick_start_time: 0.25
cycle_time: 0.01
off_below: 0.20

[heater_fan hotend_fan]
pin: toolhead:FAN0
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
tachometer_pin: ^toolhead:PA4
tachometer_ppr: 2
tachometer_poll_interval: 0.00080

[multi_pin case_fans]
pins: PA8,PE5

[controller_fan casefans]
pin: multi_pin:case_fans
kick_start_time: 0.5
#heater: heater_bed
fan_speed: 1